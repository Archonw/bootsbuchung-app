# Baut die App bei jeder Änderung. Ergebnisse unter "Actions" → Lauf → "Artifacts":
#   bootsbuchung-test.apk     zum direkten Installieren auf dem Handy
#   bootsbuchung-store.aab    für den Play Store (nur mit Signierschlüssel, siehe README)
name: App bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.BB_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "BB_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Bauen
        env:
          BB_KEYSTORE_PASSWORD: ${{ secrets.BB_KEYSTORE_PASSWORD }}
          BB_KEY_ALIAS: ${{ secrets.BB_KEY_ALIAS }}
          BB_KEY_PASSWORD: ${{ secrets.BB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "${BB_KEYSTORE_FILE:-}" ]; then
            ./gradlew --no-daemon assembleDebug bundleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bootsbuchung-test.apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: ${{ env.BB_KEYSTORE_FILE != '' }}
        with:
          name: bootsbuchung-store.aab
          path: app/build/outputs/bundle/release/*.aab
